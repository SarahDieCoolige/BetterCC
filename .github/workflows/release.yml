name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run build

      - name: Point @updateURL to release channel
        run: sed -i -E 's#// @(download|update)URL  .*#// @\1URL  ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/bettercc.user.js#' bettercc.user.js

      - name: Strip dev tag from name
        run: sed -i 's/BetterCC (dev)/BetterCC/' bettercc.user.js

      - name: Create release
        run: gh release create ${{ github.ref_name }} bettercc.user.js
        env:
          GH_TOKEN: ${{ github.token }}
